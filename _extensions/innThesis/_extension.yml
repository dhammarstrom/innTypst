title: INN Thesis (Typst book)
author: Daniel Hammarström
version: 0.2.1
quarto-required: ">=1.9.17"
contributes:
  formats:
    typst:
      # ---- Partials that replace Quarto's (and orange-book's) defaults -------
      template-partials:
        - numbering.typ
        - typst-template.typ
        - page.typ
        - typst-show.typ
        - biblio.typ
      filters:
        - path: innThesis.lua
          at: post-quarto
      format-resources:
        - inn-logo-en.png
        - inn-logo-nb.png
        - inn-logo-nn.png

      # ---- Sensible thesis defaults (override in _quarto.yml) ---------------
      papersize: a4
      toc: true
      toc-depth: 3
      number-sections: true
      number-depth: 3
      lof: false
      lot: false
      bibliographystyle: apa
      link-citations: true
      fig-format: png
      fig-dpi: 300
      df-print: default
