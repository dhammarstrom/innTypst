# =============================================================================
#  Article-based PhD dissertation ("kappe") - a complete, self-contained
#  project configuration.
#
#  To use it, swap it in for the master's thesis configuration:
#
#      mv _quarto-phd.yml _quarto.yml
#
#  Compared with a master's thesis this adds:
#    * `thesis.type: phd-articles`, which changes the statement on the title
#      page and turns the colophon page on;
#    * a `thesis.papers` list, which produces a "List of Papers" page in the
#      front matter;
#    * the dissertation series, ISBN and ISSN fields printed on the colophon.
#
#  For a PhD monograph, use `thesis.type: phd` and drop `thesis.papers`.
# =============================================================================

project:
  type: book
  output-dir: _book

book:
  title: "Physical activity and cardiometabolic health"
  subtitle: "Training responses in older adults"
  author: "Ola Nordmann"
  date: "2026-05-15"
  date-format: "MMMM YYYY"
  output-file: "dissertation"

  chapters:
    - index.qmd                          # Abstract
    - frontmatter/sammendrag.qmd
    - frontmatter/acknowledgements.qmd
    - frontmatter/abbreviations.qmd

    - chapters/01-introduction.qmd
    - chapters/02-background.qmd
    - chapters/03-methods.qmd
    - chapters/04-results.qmd
    - chapters/05-discussion.qmd

    - references.qmd
    - papers/papers.qmd

  appendices:
    - appendices/a-questionnaire.qmd
    - appendices/b-ethics.qmd

lang: en

thesis:
  type: phd-articles

  faculty: "Faculty of Health and Social Sciences"
  department: "Department of Public Health and Sport Sciences"
  place: "Elverum"
  year: "2026"

  supervisors:
    - name: "Professor Kari Nordmann"
      role: "Main supervisor"
      affiliation: "University of Inland Norway"
    - name: "Associate Professor Erik Hansen"
      role: "Co-supervisor"
      affiliation: "Norwegian School of Sport Sciences"

  # ---- The papers that make up the dissertation ----------------------------
  # Each entry becomes one item on the "List of Papers" page. Use `citation:`
  # instead of the separate fields if you would rather write the reference out
  # yourself.
  papers:
    - label: "I"
      authors: "Nordmann, O., Hansen, E., & Nordmann, K."
      year: "2024"
      title: "Cardiorespiratory fitness in community-dwelling older adults: a cross-sectional analysis"
      journal: "Scandinavian Journal of Public Health, 52(3), 210–219"
      status: "Published"
      doi: "10.1177/00000000000000"
    - label: "II"
      authors: "Nordmann, O., & Nordmann, K."
      year: "2025"
      title: "Supervised endurance training in older adults: a randomised controlled trial"
      journal: "Medicine & Science in Sports & Exercise, 57(1), 44–55"
      status: "Published"
      doi: "10.1249/MSS.0000000000000000"
    - label: "III"
      authors: "Nordmann, O., Hansen, E., Berg, S., & Nordmann, K."
      year: "2026"
      title: "Individual variation in the response to supervised training"
      journal: "Journal of Applied Physiology"
      status: "Submitted"

  # ---- Colophon (verso of the title page) ----------------------------------
  colophon: true
  copyright: "Ola Nordmann"
  series: "Doctoral dissertations at the University of Inland Norway"
  series-number: "42"
  isbn-printed: "978-82-8380-000-0"
  isbn-digital: "978-82-8380-001-7"
  issn-printed: "2535-6151"
  issn-digital: "2535-6143"
  printed-by: "Flisa Trykkeri A/S"
  colophon-note: "The papers reproduced in this dissertation are included with permission from the respective publishers."

  dedication: "For everyone who turned up at seven in the morning."

  two-sided: true
  open-right: true
  running-head: true
  toc-position: before-chapters

bibliography: references.bib
bibliographystyle: apa

crossref:
  chapters: true

format:
  innThesis-typst:
    toc: true
    toc-depth: 3
    lof: true
    lot: true
    fontsize: 11pt
    linestretch: 1.4
